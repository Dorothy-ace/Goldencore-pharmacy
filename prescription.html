<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Prescription - Golden's Pharmacy</title>
  <style>
    :root { --pharmacy-blue: #0284c7; --pharmacy-green: #059669; --dark: #1e293b; --light: #f8fafc; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--light); color: var(--dark); line-height: 1.6; }
    
    header { background: var(--pharmacy-blue); color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.5rem; font-weight: 800; color: white; text-decoration: none; }
    .logo span { color: #fde047; }
    
    nav ul { display: flex; list-style: none; gap: 15px; flex-wrap: wrap; }
    nav a { color: white; text-decoration: none; font-size: 0.9rem; font-weight: 500; }
    nav a:hover, nav a.active { color: #fde047; }

    .page-title { background: var(--pharmacy-blue); color: white; text-align: center; padding: 2.5rem 1rem; border-top: 3px solid #fde047; }
    .container { max-width: 700px; margin: 3rem auto; padding: 0 20px; }
    
    .form-box { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
    .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 1rem; }
    .submit-btn { background: var(--pharmacy-green); color: white; border: none; width: 100%; padding: 12px; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 1rem; }
    .submit-btn:hover { background: #047857; }

    footer { background: var(--dark); color: white; text-align: center; padding: 20px; margin-top: 4rem; }
  </style>
</head>
<body>

  <header>
    <a href="pharmacy-index.html" class="logo">💊 GOLDEN'S <span>PHARMACY</span></a>
    <nav>
      <ul>
        <li><a href="pharmacy-index.html">Home</a></li>
        <li><a href="medicines.html">Medicines & Indications</a></li>
        <li><a href="herbs.html">Natural Herbs</a></li>
        <li><a href="prescription.html" class="active">Upload Prescription</a></li>
        <li><a href="pharmacy-cart.html">🛒 Cart</a></li>
      </ul>
    </nav>
  </header>

  <div class="page-title">
    <h1>Prescription Refill & Dispensing</h1>
    <p>Upload your doctor's prescription for pharmacist review and home delivery</p>
  </div>

  <main class="container">
    <div class="form-box">
      <form onsubmit="event.preventDefault(); alert('Prescription uploaded successfully! Our pharmacist will contact you shortly.');">
        <div class="form-group">
          <label for="patientName">Patient Full Name</label>
          <input type="text" id="patientName" required placeholder="Enter full name">
        </div>
        <div class="form-group">
          <label for="phone">Phone / WhatsApp Number</label>
          <input type="tel" id="phone" required placeholder="e.g. +254 700 000000">
        </div>
        <div class="form-group">
          <label for="prescriptionFile">Upload Doctor's Prescription (Image or PDF)</label>
          <input type="file" id="prescriptionFile" accept="image/*,application/pdf" required>
        </div>
        <div class="form-group">
          <label for="notes">Additional Instructions or Delivery Address</label>
          <textarea id="notes" rows="3" placeholder="Specify any specific brand preference or delivery location"></textarea>
        </div>
        <button type="submit" class="submit-btn">Submit Prescription for Review</button>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Golden's Pharmacy. Licensed Healthcare Provider. All Rights Reserved.</p>
  </footer>

</body>
</html>
